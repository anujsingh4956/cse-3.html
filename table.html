<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 30px;
            font-size: 15px;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #555555;
            padding: 12px 16px;
        }

        .main-table {
            width: 520px;
        }

        .main-table > thead > tr > th {
            width: 50%;
            text-align: center;
            font-weight: normal;
            padding: 16px;
        }

        .inner-table {
            width: 100%;
            margin-top: 4px;
        }

        .inner-table td {
            width: 50%;
            text-align: left;
            padding: 12px 14px;
        }

        .biodata-table {
            width: 440px;
        }

        .biodata-table caption {
            font-size: 16px;
            margin-bottom: 6px;
            text-align: center;
        }

        .biodata-table th {
            font-weight: bold;
            text-align: left;
            padding: 14px 16px;
        }

        .biodata-table td {
            text-align: left;
            padding: 16px 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <table class="main-table">
            <thead>
                <tr>
                    <th>Main Table column 1</th>
                    <th>Main Table column 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="2" style="padding: 8px;">
                        <table class="inner-table">
                            <tr>
                                <td>Inner Table row 1 column 1</td>
                                <td>Inner Table row 1 column 2</td>
                            </tr>
                            <tr>
                                <td>Inner Table row 2 column 1</td>
                                <td>Inner Table row 2 column 2</td>
                            </tr>
                            <tr>
                                <td>Inner Table row 3 column 1</td>
                                <td>Inner Table row 3 column 2</td>
                            </tr>
                            <tr>
                                <td>1</td>
                                <td>2</td>
                            </tr>
                            <tr>
                                <td>-1</td>
                                <td>-2</td>
                            </tr>
                            <tr>
                                <td>1</td>
                                <td>-2</td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </tbody>
        </table>

        <table class="biodata-table">
            <caption>BIODATA</caption>
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Name</th>
                    <th>Surname</th>
                    <th>Number</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Anuj</td>
                    <td>Singh</td>
                    <td>8429****41</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
